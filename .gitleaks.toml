# gitleaks configuration: the default rules, plus the narrow allowlist below.
[extend]
useDefault = true

[[allowlists]]
description = "Public contract addresses in the Reference network files (content/reference/networks/<network>.json): a manifest key and a 20-byte address, or a 32-byte Uniswap v4 PoolId. On-chain addresses are public, not credentials; generic-api-key flags keys that contain words such as token or access. Approved by Josue, 2026-11-17."
condition = "AND"
paths = ['''content/reference/networks/[a-z0-9-]+\.json''']
regexTarget = "line"
regexes = ['''^\s*"[A-Za-z0-9_.\- /()]+": "0x(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})",?\s*$''']
